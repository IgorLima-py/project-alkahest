{% extends "base.html" %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card bg-dark border-secondary text-white p-5 text-center" style="max-width: 500px;">
        <div class="mb-4">
            <i class="bi bi-envelope-check fs-1 text-warning"></i>
        </div>
        <h2 class="mb-3">Verifique seu E-mail</h2>
        <p class="text-muted">
            Enviamos um link de confirmação para o endereço cadastrado.
            Por favor, verifique sua caixa de entrada (e spam) para ativar sua conta.
        </p>
        <div class="mt-4">
            <a href="{% url 'login' %}" class="btn btn-outline-light">Voltar para Login</a>
        </div>
    </div>
</div>
{% endblock %}
