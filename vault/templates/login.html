{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-dark border-secondary p-4 shadow-lg">
            <h3 class="text-center mb-4 text-warning fw-bold">Login no Alkahest</h3>
            
            <form method="post">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-muted">Usuário</label>
                    <input type="text" name="username" class="form-control bg-secondary text-light border-0" required autofocus>
                </div>
                
                <div class="mb-4">
                    <label class="form-label text-muted">Senha</label>
                    <input type="password" name="password" class="form-control bg-secondary text-light border-0" required>
                </div>

                {% if form.errors %}
                    <div class="alert alert-danger py-2 small">
                        Usuário ou senha incorretos.
                    </div>
                {% endif %}
                
                <div class="d-grid">
                    <button type="submit" class="btn btn-warning fw-bold text-dark">ENTRAR</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
