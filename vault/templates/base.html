<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Alkahest</title>
    <!-- Bootstrap CSS (Design pronto) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f0f0f; } /* Fundo quase preto */
        
        /* Estilos globais dos cards */
        .card-game { 
            transition: transform 0.2s; 
            border: none; 
            background: #1f1f1f;
        }
        .card-game:hover { 
            transform: translateY(-5px); 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }
        
        /* Barras de Status coloridas */
        .status-bar { height: 4px; width: 100%; }
        .bg-playing { background-color: #2ecc71; }
        .bg-backlog { background-color: #f39c12; }
        .bg-completed { background-color: #3498db; }
        .bg-dropped { background-color: #e74c3c; }
    </style>
</head>
<body>

    <!-- Navbar Fixa -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-box-seam-fill me-2"></i>ALKAHEST
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <!-- Link Biblioteca (Home) -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'library' %}">Biblioteca</a>
                    </li>
                    
                    <!-- Link Meu Perfil (NOVO) -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'profile' %}">Meu Perfil</a>
                    </li>

                    <!-- Link Admin -->
                    <li class="nav-item">
                        <a class="nav-link" href="/admin">Admin</a>
                    </li>
                </ul>

                <!-- Campo de Busca -->
                <form class="d-flex" method="GET" action="/">
                    <!-- Mantemos os filtros atuais ocultos ao buscar -->
                    {% if request.GET.status %}<input type="hidden" name="status" value="{{ request.GET.status }}">{% endif %}
                    {% if request.GET.platform %}<input type="hidden" name="platform" value="{{ request.GET.platform }}">{% endif %}
                    
                    <input class="form-control form-control-sm me-2 bg-dark text-light border-secondary" type="search" name="q" placeholder="Buscar jogo..." value="{{ request.GET.q|default:'' }}">
                </form>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        <!-- O conteúdo das páginas entra aqui -->
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
