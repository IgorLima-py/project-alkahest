<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Alkahest</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        body { background-color: #0f0f0f; font-family: 'Segoe UI', sans-serif; }
        
        /* --- CARDS --- */
        .card-game { 
            transition: transform 0.2s; border: none; background: #1f1f1f; 
        }
        .card-game:hover { 
            transform: translateY(-5px); cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }
        
        /* --- BARRAS DE STATUS --- */
        .status-bar { height: 4px; width: 100%; }
        .bg-playing { background-color: #2ecc71; }
        .bg-backlog { background-color: #f39c12; }
        .bg-completed { background-color: #3498db; }
        .bg-dropped { background-color: #e74c3c; }

        /* --- CSS MAGIC: STAR RATING (INPUT) --- */
        /* Isso faz o input de estrelas funcionar com meias estrelas */
        .rate { display: inline-block; border: 0; }
        .rate > input { display: none; }
        .rate { float: left; } /* Garante alinhamento */
        
        .rate > label { 
            float: right; 
            color: #444; 
            cursor: pointer; 
            font-size: 1.8rem; 
            padding: 0;
            position: relative;
        }

        /* Estrela Cheia */
        .rate > label:before { 
            content: "\F586"; /* Bootstrap Icon: star */
            font-family: "bootstrap-icons";
            display: inline-block;
            padding: 0 2px;
        }
        
        /* Meia Estrela (Sobreposta) */
        .rate .half:before { 
            content: "\F586"; /* Bootstrap Icon: star */
            font-family: "bootstrap-icons";
            position: absolute; 
            left: 0; 
            width: 50%; 
            overflow: hidden; 
            z-index: 1;
        }

        /* Cores (Amarelo ao selecionar/hover) */
        .rate > input:checked ~ label,
        .rate > label:hover, 
        .rate > label:hover ~ label { color: #ffc107; }
        
        .rate > input:checked + label:hover, 
        .rate > input:checked ~ label:hover,
        .rate > label:hover ~ input:checked ~ label, 
        .rate > input:checked ~ label:hover ~ label { color: #cc9a06; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-box-seam-fill me-2"></i>ALKAHEST
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'library' %}">Biblioteca</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'my_lists' %}">Minhas Listas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'profile' %}">Meu Perfil</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
                </ul>

                <!-- Área de Ação e Busca -->
                <div class="d-flex align-items-center ms-lg-3">
                    <a href="{% url 'add_game' %}" class="btn btn-warning btn-sm me-2 flex-shrink-0">
                        <i class="bi bi-plus-circle-fill"></i> Add Jogo
                    </a>
                    <form class="d-flex w-100" method="GET" action="/">
                        <input class="form-control form-control-sm me-2 bg-dark text-light border-secondary" type="search" name="q" placeholder="Buscar na biblioteca..." value="{{ request.GET.q|default:'' }}" style="min-width: 200px;">
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
