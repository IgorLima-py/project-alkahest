{% extends 'base.html' %}
{% block content %}
<h1 class="display-5 fw-bold">Editar Review</h1>
<p class="lead text-muted">Para o jogo: {{ review.library_entry.platform_game.master_game.title }}</p>

<div class="card bg-dark border-secondary p-4">
    <form method="POST">
        {% csrf_token %}
        <!-- Aqui você pode estilizar o formulário como quiser, ex: -->
        <div class="mb-3">
            <label class="form-label">Nota</label>
            {{ form.rating }}
        </div>
        <div class="mb-3">
            <label class="form-label">Texto da Review</label>
            {{ form.text }}
        </div>
        <!-- Adicione outros campos do form aqui -->
        <button type="submit" class="btn btn-success">Salvar Alterações</button>
    </form>
</div>
{% endblock %}
